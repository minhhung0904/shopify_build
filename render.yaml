services:
  - type: web
    name: order-sync
    runtime: docker
    dockerfilePath: ./order-sync/Dockerfile
    dockerContext: ./order-sync
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

      # Shopify — filled in after `shopify app config link`
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false          # set to your Render service URL, e.g. https://order-sync-xxxx.onrender.com
      - key: SCOPES
        value: read_orders

      # MongoDB
      - key: DATABASE_URL
        sync: false          # mongodb+srv://user:pass@cluster/
      - key: MONGO_DB_NAME
        value: order-sync

      # Encryption — generate with: openssl rand -base64 32
      - key: ENCRYPTION_KEY
        generateValue: true

      # Platform
      - key: PLATFORM_API_URL
        sync: false          # https://your-platform.com/api
      - key: PLATFORM_ORDERS_PATH
        value: /orders
      - key: PLATFORM_VERIFY_PATH
        value: ""            # optional: endpoint to validate merchant tokens
      - key: PLATFORM_TIMEOUT_MS
        value: "3000"
